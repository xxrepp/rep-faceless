appId: id.bangtutorial.bangstory
productName: Bang Story
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!node_modules/ffmpeg-static/{README.md,example.js,install.js,ffmpeg.exe.README}'
extraResources:
  - from: resources/scenepulse
    to: scenepulse
  - from: resources/fonts
    to: fonts
  - from: node_modules/ffmpeg-static/ffmpeg.exe.LICENSE
    to: licenses/FFmpeg-LICENSE.txt
  - from: resources/licenses
    to: licenses
  - from: node_modules/gsap/README.md
    to: licenses/GSAP-README.md
  - from: resources/whisper
    to: whisper
asarUnpack:
  # HyperFrames' child Node process resolves its CLI and assets outside asar.
  - node_modules/**
  - node_modules/ffmpeg-static/**
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: BangStory-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Bang Story
npmRebuild: true
